# Keep development resources separate from other Docker projects
name: agrobot-dev
services:
  dev:
    # Build natively for this x86-64 Linux machine
    image: agrobot:lyrical-amd64-dev
    platform: linux/amd64
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.dev
    # Keep a shell available without starting hardware or graphical tools
    init: true
    stdin_open: true
    tty: true
    # Keep Python from writing cache files into the shared source tree
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      # Forward Qt windows through the local authenticated X11 display
      DISPLAY: "${DISPLAY:-:0}"
      XAUTHORITY: /run/agrobot.xauth
      QT_QPA_PLATFORM: xcb
      QT_X11_NO_MITSHM: "1"
      # Render without requiring GPU device passthrough
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      # Share the display socket and cookie without weakening X11 access control
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - type: bind
        source: "${XAUTHORITY:-${HOME}/.Xauthority}"
        target: /run/agrobot.xauth
        read_only: true
        bind:
          create_host_path: false
      # Share source edits while retaining Linux-only build artifacts in volumes
      - .:/workspace
      - ./src:/ros2_ws/src
      - build:/ros2_ws/build
      - install:/ros2_ws/install
      - logs:/ros2_ws/log

# Preserve build products and logs across container recreation
volumes:
  build:
  install:
  logs:
