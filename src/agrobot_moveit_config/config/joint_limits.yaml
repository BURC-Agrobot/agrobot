# Use this file to replace or extend dynamics properties from the URDF

# Reduce velocity and acceleration limits for beginners
# Motion requests can specify higher scaling factors (<= 1.0)
# Increase the values below to 1.0 to always move at maximum speed
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

# Change joint properties with these keys:
#   max_position, min_position, max_velocity, max_acceleration
# Disable joint limits with has_velocity_limits and has_acceleration_limits
# Velocity limits come only from the URDF so each limit has one source
# Acceleration limits are mock-only placeholders, not verified hardware limits
# Arm acceleration: rad/s^2. Rail acceleration: m/s^2
joint_limits:
  arm_joint_1:
    has_acceleration_limits: true
    max_acceleration: 0.5
  arm_joint_2:
    has_acceleration_limits: true
    max_acceleration: 0.5
  arm_joint_3:
    has_acceleration_limits: true
    max_acceleration: 0.5
  arm_joint_4:
    has_acceleration_limits: true
    max_acceleration: 0.5
  arm_joint_5:
    has_acceleration_limits: true
    max_acceleration: 0.5
  arm_joint_6:
    has_acceleration_limits: true
    max_acceleration: 0.5
  rail_joint:
    has_acceleration_limits: true
    max_acceleration: 0.1
